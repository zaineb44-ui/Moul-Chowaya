<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin · Moul Chowaya</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg: #0b0907;
            --panel: #15110d;
            --yellow: #ffd21a;
            --cream: #fff5df;
            --muted: #c9bcae;
            --line: rgba(255, 255, 255, .1);
            --red: #b8291c;
            --green: #2e7d32;
        }
        body {
            font-family: Inter, Arial, sans-serif;
            background: var(--bg);
            color: var(--cream);
            padding: 30px 20px;
            min-height: 100vh;
        }
        .wrap {
            max-width: 1300px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 28px;
            letter-spacing: -1px;
        }
        header h1 span {
            color: var(--yellow);
        }
        .badge {
            background: var(--yellow);
            color: #171006;
            padding: 4px 14px;
            border-radius: 999px;
            font-weight: 900;
            font-size: 14px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
        }
        .controls input,
        .controls select {
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: #0f0c09;
            color: var(--cream);
            font-size: 14px;
            font-family: inherit;
        }
        .controls input:focus,
        .controls select:focus {
            outline: none;
            border-color: var(--yellow);
        }
        .controls input {
            flex: 1;
            min-width: 200px;
        }
        .refresh-btn {
            background: var(--yellow);
            color: #171006;
            border: none;
            padding: 10px 22px;
            border-radius: 999px;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            transition: .2s;
        }
        .refresh-btn:hover {
            opacity: .8;
        }
        .refresh-btn:disabled {
            opacity: .4;
            cursor: not-allowed;
        }
        .stats {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            font-size: 14px;
            color: var(--muted);
        }
        .stats strong {
            color: var(--cream);
        }

        .orders-table-wrap {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid var(--line);
            background: var(--panel);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 700px;
        }
        th {
            text-align: left;
            padding: 14px 16px;
            background: #1f1914;
            color: var(--muted);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: .5px;
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 2;
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, .04);
            vertical-align: middle;
        }
        tr:hover td {
            background: rgba(255, 255, 255, .03);
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .status-pending {
            background: #f2a90022;
            color: #f2a900;
        }
        .status-preparing {
            background: #ff8c0022;
            color: #ff8c00;
        }
        .status-ready {
            background: #2e7d3222;
            color: #4caf50;
        }
        .status-delivered {
            background: #2196f322;
            color: #64b5f6;
        }
        .status-cancelled {
            background: #b8291c22;
            color: #ef5350;
        }

        .status-select {
            background: transparent;
            border: 1px solid var(--line);
            color: var(--cream);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
        .status-select:focus {
            outline: none;
            border-color: var(--yellow);
        }
        .status-select option {
            background: #1a1511;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #8a7a6a;
            cursor: pointer;
            font-size: 18px;
            padding: 4px 8px;
            border-radius: 8px;
            transition: .2s;
        }
        .delete-btn:hover {
            color: var(--red);
            background: rgba(184, 41, 28, .15);
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }
        .empty-state .big {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--line);
            border-top: 3px solid var(--yellow);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1f1914;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 16px 24px;
            color: var(--cream);
            font-weight: 600;
            font-size: 14px;
            transform: translateY(120px);
            opacity: 0;
            transition: .4s cubic-bezier(.22, .61, .36, 1);
            z-index: 999;
            box-shadow: 0 12px 32px rgba(0, 0, 0, .6);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast.success {
            border-left: 4px solid var(--green);
        }
        .toast.error {
            border-left: 4px solid var(--red);
        }

        @media(max-width:600px) {
            header h1 {
                font-size: 22px;
            }
            .controls input {
                min-width: 140px;
            }
            td,
            th {
                padding: 10px 12px;
                font-size: 13px;
            }
            .stats {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="wrap">
        <header>
            <h1>📋 Admin · <span>Moul Chowaya</span></h1>
            <span class="badge" id="orderCount">0 commandes</span>
        </header>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="🔍 Rechercher (nom, téléphone, items…)" />
            <select id="statusFilter">
                <option value="all">Tous les statuts</option>
                <option value="Pending">⏳ En attente</option>
                <option value="Preparing">👨‍🍳 En préparation</option>
                <option value="Ready">✅ Prêt</option>
                <option value="Delivered">📦 Livré</option>
                <option value="Cancelled">❌ Annulé</option>
            </select>
            <button class="refresh-btn" id="refreshBtn">🔄 Actualiser</button>
        </div>

        <div class="stats" id="statsBar">
            <span>Total: <strong id="statTotal">0</strong></span>
            <span>En attente: <strong id="statPending">0</strong></span>
            <span>En préparation: <strong id="statPreparing">0</strong></span>
            <span>Prêts: <strong id="statReady">0</strong></span>
        </div>

        <div class="orders-table-wrap">
            <div id="tableContainer">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Client</th>
                            <th>Téléphone</th>
                            <th>Articles</th>
                            <th>Total</th>
                            <th>Statut</th>
                            <th>Date</th>
                            <th style="width:60px;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="ordersBody">
                        <tr>
                            <td colspan="8">
                                <div class="empty-state">
                                    <div class="big">📭</div>
                                    <p>Aucune commande pour le moment.</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
// ═══ CONFIGURATION AIRTABLE ═══
const AIRTABLE_API_KEY = 'patyj6u0PZd84J6m6.c219829f1b05344107fa54dabea848dce3b6655bf7e655fca6c132292afbb017';
const AIRTABLE_BASE_ID = 'appoeaIgh98U6lUuS';
const AIRTABLE_TABLE_NAME = 'tblJw87JqJtftBlVj'; // <-- exactly as in the console test
const AIRTABLE_URL = `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${AIRTABLE_TABLE_NAME}`; // <-- v0, not v6

        // ═══ ÉTAT ═══
        let orders = [];
        let isLoading = false;

        // ═══ DOM REFS ═══
        const ordersBody = document.getElementById('ordersBody');
        const searchInput = document.getElementById('searchInput');
        const statusFilter = document.getElementById('statusFilter');
        const refreshBtn = document.getElementById('refreshBtn');
        const orderCount = document.getElementById('orderCount');
        const statTotal = document.getElementById('statTotal');
        const statPending = document.getElementById('statPending');
        const statPreparing = document.getElementById('statPreparing');
        const statReady = document.getElementById('statReady');
        const toast = document.getElementById('toast');

        // ═══ TOAST ═══
        let toastTimeout;

        function showToast(message, type = 'success') {
            clearTimeout(toastTimeout);
            toast.textContent = message;
            toast.className = `toast ${type}`;
            void toast.offsetWidth;
            toast.classList.add('show');
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // ═══ FETCH ORDERS ═══
        async function fetchOrders() {
            if (isLoading) return;
            isLoading = true;
            refreshBtn.disabled = true;
            refreshBtn.textContent = '⏳ Chargement…';

            try {
                const response = await fetch(AIRTABLE_URL, {
                    headers: {
                        'Authorization': `Bearer ${AIRTABLE_API_KEY}`
                    }
                });

                if (!response.ok) {
                    const err = await response.text();
                    throw new Error(`Erreur ${response.status}: ${err}`);
                }

                const data = await response.json();
                orders = data.records.map(record => ({
                    id: record.id,
                    ...record.fields,
                    'Customer Name': record.fields['Customer Name'] || '—',
                    'Phone': record.fields['Phone'] || '—',
                    'Address': record.fields['Address'] || '—',
                    'Items': record.fields['Items'] || '—',
                    'Total': record.fields['Total'] || 0,
                    'Status': record.fields['Status'] || 'Pending',
                    'Notes': record.fields['Notes'] || '',
                    'Order Date': record.fields['Order Date'] || record.createdTime || ''
                }));

                orders.sort((a, b) => {
                    const dateA = new Date(a['Order Date'] || a.createdTime || 0);
                    const dateB = new Date(b['Order Date'] || b.createdTime || 0);
                    return dateB - dateA;
                });

                renderOrders();
                updateStats();
                orderCount.textContent = `${orders.length} commande${orders.length > 1 ? 's' : ''}`;
                showToast(`✅ ${orders.length} commandes chargées`, 'success');

            } catch (err) {
                console.error('Fetch error:', err);
                showToast(`❌ Erreur: ${err.message}`, 'error');
                ordersBody.innerHTML = `
                        <tr>
                            <td colspan="8">
                                <div class="empty-state">
                                    <div class="big">⚠️</div>
                                    <p>Impossible de charger les commandes.<br />
                                    Vérifiez votre clé API et l'ID de base Airtable.</p>
                                    <p style="font-size:12px;color:#8a7a6a;margin-top:8px;">${err.message}</p>
                                </div>
                            </td>
                        </tr>
                    `;
            } finally {
                isLoading = false;
                refreshBtn.disabled = false;
                refreshBtn.textContent = '🔄 Actualiser';
            }
        }

        // ═══ RENDER ═══
        function renderOrders() {
            const search = searchInput.value.toLowerCase().trim();
            const status = statusFilter.value;

            let filtered = orders.filter(order => {
                const name = (order['Customer Name'] || '').toLowerCase();
                const phone = (order['Phone'] || '').toLowerCase();
                const items = (order['Items'] || '').toLowerCase();
                const notes = (order['Notes'] || '').toLowerCase();
                const matchSearch = !search ||
                    name.includes(search) ||
                    phone.includes(search) ||
                    items.includes(search) ||
                    notes.includes(search);
                const matchStatus = status === 'all' || order['Status'] === status;
                return matchSearch && matchStatus;
            });

            if (filtered.length === 0) {
                ordersBody.innerHTML = `
                        <tr>
                            <td colspan="8">
                                <div class="empty-state">
                                    <div class="big">🔍</div>
                                    <p>Aucune commande ne correspond à votre recherche.</p>
                                </div>
                            </td>
                        </tr>
                    `;
                return;
            }

            let html = '';
            filtered.forEach((order, index) => {
                const statusClass = `status-${(order['Status'] || 'Pending').toLowerCase()}`;
                const dateStr = order['Order Date'] ?
                    new Date(order['Order Date']).toLocaleString('fr-FR', { day: '2-digit', month: 'short',
                        year: 'numeric', hour: '2-digit', minute: '2-digit' }) :
                    '—';

                html += `
                        <tr data-id="${order.id}">
                            <td>${index + 1}</td>
                            <td><strong>${escapeHtml(order['Customer Name'])}</strong>${order['Address'] && order['Address'] !== 'Non renseigné' ? `<br /><small style="color:var(--muted);font-size:12px;">📍 ${escapeHtml(order['Address'])}</small>` : ''}</td>
                            <td>${escapeHtml(order['Phone'])}</td>
                            <td style="max-width:200px;font-size:13px;word-break:break-word;">${escapeHtml(order['Items'])}</td>
                            <td><strong>${order['Total']} DH</strong></td>
                            <td>
                                <select class="status-select" data-id="${order.id}" data-current="${order['Status']}">
                                    <option value="Pending" ${order['Status'] === 'Pending' ? 'selected' : ''}>⏳ En attente</option>
                                    <option value="Preparing" ${order['Status'] === 'Preparing' ? 'selected' : ''}>👨‍🍳 En préparation</option>
                                    <option value="Ready" ${order['Status'] === 'Ready' ? 'selected' : ''}>✅ Prêt</option>
                                    <option value="Delivered" ${order['Status'] === 'Delivered' ? 'selected' : ''}>📦 Livré</option>
                                    <option value="Cancelled" ${order['Status'] === 'Cancelled' ? 'selected' : ''}>❌ Annulé</option>
                                </select>
                                <span class="status-badge ${statusClass}" style="display:inline-block;margin-top:4px;">
                                    ${order['Status'] || 'Pending'}
                                </span>
                            </td>
                            <td style="font-size:12px;color:var(--muted);">${dateStr}</td>
                            <td>
                                <button class="delete-btn" data-id="${order.id}" title="Supprimer">🗑️</button>
                            </td>
                        </tr>
                    `;
            });

            ordersBody.innerHTML = html;

            ordersBody.querySelectorAll('.status-select').forEach(sel => {
                sel.addEventListener('change', async (e) => {
                    const id = sel.dataset.id;
                    const newStatus = sel.value;
                    await updateOrderStatus(id, newStatus);
                });
            });

            ordersBody.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = btn.dataset.id;
                    if (confirm('🗑️ Supprimer définitivement cette commande ?')) {
                        await deleteOrder(id);
                    }
                });
            });
        }

        // ═══ HELPERS ═══
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateStats() {
            const total = orders.length;
            const pending = orders.filter(o => o['Status'] === 'Pending').length;
            const preparing = orders.filter(o => o['Status'] === 'Preparing').length;
            const ready = orders.filter(o => o['Status'] === 'Ready').length;

            statTotal.textContent = total;
            statPending.textContent = pending;
            statPreparing.textContent = preparing;
            statReady.textContent = ready;
        }

        // ═══ UPDATE STATUS ═══
        async function updateOrderStatus(id, newStatus) {
            try {
                const response = await fetch(`${AIRTABLE_URL}/${id}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${AIRTABLE_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        fields: { 'Status': newStatus }
                    })
                });

                if (!response.ok) {
                    const err = await response.text();
                    throw new Error(`Erreur ${response.status}: ${err}`);
                }

                const order = orders.find(o => o.id === id);
                if (order) {
                    order['Status'] = newStatus;
                }
                renderOrders();
                updateStats();
                showToast(`✅ Statut mis à jour → ${newStatus}`, 'success');

            } catch (err) {
                console.error('Update error:', err);
                showToast(`❌ Erreur: ${err.message}`, 'error');
                await fetchOrders();
            }
        }

        // ═══ DELETE ORDER ═══
        async function deleteOrder(id) {
            try {
                const response = await fetch(`${AIRTABLE_URL}/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${AIRTABLE_API_KEY}`
                    }
                });

                if (!response.ok) {
                    const err = await response.text();
                    throw new Error(`Erreur ${response.status}: ${err}`);
                }

                orders = orders.filter(o => o.id !== id);
                renderOrders();
                updateStats();
                orderCount.textContent = `${orders.length} commande${orders.length > 1 ? 's' : ''}`;
                showToast(`🗑️ Commande supprimée`, 'success');

            } catch (err) {
                console.error('Delete error:', err);
                showToast(`❌ Erreur: ${err.message}`, 'error');
                await fetchOrders();
            }
        }

        // ═══ ÉVÉNEMENTS ═══
        refreshBtn.addEventListener('click', fetchOrders);
        searchInput.addEventListener('input', renderOrders);
        statusFilter.addEventListener('change', renderOrders);

        // ═══ CHARGEMENT INITIAL ═══
        fetchOrders();

        setInterval(() => {
            if (!isLoading) {
                fetchOrders();
            }
        }, 30000);

        console.log('📋 Admin panel ready — Moul Chowaya');
        console.log('🔑 Utilise les mêmes identifiants Airtable que dans index.html');
    </script>

</body>
</html>
